name: Analyst Engine (Python)

on:
  push:
    branches: [ main, develop ]
    paths: [ 'analyst/**', 'prompts/**', '.github/workflows/analyst.yml' ]
  pull_request:
    paths: [ 'analyst/**', 'prompts/**', '.github/workflows/analyst.yml' ]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest — factor model, backtest, agent loop (offline)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.12' ]
    defaults:
      run:
        working-directory: analyst

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install
      run: pip install -e '.[llm,dev]'

    - name: Test (synthetic data + fake Claude client — no network, no API key)
      run: python -m pytest -q
